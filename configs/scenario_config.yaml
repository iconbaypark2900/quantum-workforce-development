# Scenario generation configuration for Mean-CVaR and tail-risk modeling.
#
# Used by: services/scenario_generation.py::generate_scenarios()
# Loaded by: API request body (scenario_method, n_scenarios, ...) or CLI
#
# This file documents the canonical defaults. Override any field in the
# request body or CLI flags.

# ── Default profile ──────────────────────────────────────────────────────────
default:
  method: block          # historical | block | gaussian | student_t
  n_scenarios: 10000
  block_size: 20         # used only for block bootstrap
  df: 5.0                # degrees of freedom for student_t
  seed: 42

# ── Pre-defined profiles ─────────────────────────────────────────────────────
profiles:

  fast_baseline:
    method: gaussian
    n_scenarios: 1000
    seed: 42
    description: |
      Fast Gaussian Monte Carlo. Best for quick iterations and unit tests.
      Assumes returns are normally distributed — underestimates tail risk.

  block_bootstrap_standard:
    method: block
    n_scenarios: 10000
    block_size: 20
    seed: 42
    description: |
      Block bootstrap with 20-day blocks. Preserves short-term
      autocorrelation and volatility clustering. Recommended default
      for daily-return CVaR optimization.

  fat_tail_stress:
    method: student_t
    n_scenarios: 10000
    df: 4.0
    seed: 42
    description: |
      Student-t with df=4 for heavier tails than Gaussian. Use when modeling
      crisis regimes or fat-tailed assets (crypto, EM equities).

  historical_replay:
    method: historical
    n_scenarios: 5000
    seed: 42
    description: |
      i.i.d. bootstrap from observed return rows. Simplest baseline;
      no parametric assumptions. Sample size limited by history length.

# ── Mean-CVaR optimizer defaults ──────────────────────────────────────────────
mean_cvar:
  confidence_level: 0.95
  risk_aversion: 1.0
